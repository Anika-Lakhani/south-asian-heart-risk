name: Donation health check

# Once a day: run a real database query so Supabase's free plan doesn't pause the
# project for inactivity (it pauses after about a week without database activity),
# and confirm the donate function is answering. A failure here emails the repo
# owner, so it doubles as monitoring.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: vars.VITE_SUPABASE_URL != ''
    env:
      URL: ${{ vars.VITE_SUPABASE_URL }}
      KEY: ${{ vars.VITE_SUPABASE_KEY }}
    steps:
      - name: Database answers (and stays active)
        run: |
          count=$(curl -sf -X POST "$URL/rest/v1/rpc/contributor_count" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Contributors so far: $count"
      - name: Donate function answers
        run: |
          # A request without a bot-check token must be refused with 400,
          # which proves the function is deployed and running.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/functions/v1/donate" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Function replied HTTP $code"
          test "$code" = "400"
