[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heartrisk"
version = "0.1.0"
description = "10-year cardiovascular risk from PCE, PREVENT, and QRISK3, with measurement-uncertainty simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND LGPL-3.0-or-later"
authors = [{ name = "Anika Lakhani" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
app = ["streamlit>=1.46", "altair>=5", "pandas>=2"]
dev = ["pytest>=8", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/heartrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
